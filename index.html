<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Natural Beauty — All-natural skincare</title>
  <meta name="description" content="Natural Beauty: small-batch, all-natural face, body and hair care. Concept preview." />
  <meta name="theme-color" content="#efe9e1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230e0e0e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2716%27 font-weight=%27800%27 text-anchor=%27middle%27 fill=%27%23efe9e1%27 font-family=%27Arial%27%3ENB%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-step="hero">
  <div id="preloader" aria-hidden="true"><span>NB</span><i></i></div>

  <div id="backdrop" aria-hidden="true"></div>
  <div id="stage"><canvas id="gl" aria-hidden="true"></canvas></div>
  <div id="fade" aria-hidden="true"></div>
  <div id="fallback" aria-hidden="true"><img src="/logo.png" alt="" /></div>
  <p id="notice" class="notice" role="status" hidden></p>
  <div id="curtain" aria-hidden="true"></div>

  <header class="nav">
    <a class="nav-brand" href="/" aria-label="Natural Beauty home"><img src="/logo.png" alt="Natural Beauty" width="85" height="44" /></a>
    <button class="cart-btn" id="cartBtn" aria-label="Open bag">Bag <b id="cartCount">0</b></button>
  </header>

  <button class="back" id="back" aria-label="Back one step"><i>←</i><span>Back</span></button>

  <!-- 1 · HERO -->
  <section class="step" data-panel="hero" aria-label="Welcome">
    <div class="hero-copy">
      <h1>Nothing to hide.</h1>
      <button class="btn btn-solid cta" id="enter">Shop</button>
    </div>
    <div class="scroll-cue" aria-hidden="true"><span>Scroll</span><i></i></div>
  </section>

  <!-- 2 · CATEGORY (scroll is gated until one is chosen) -->
  <section class="step" data-panel="cats" aria-label="Choose a category">
    <div class="cats" id="cats"></div>
  </section>

  <!-- 3 + 4 · PRODUCT and INSIDE share the card; the CTA changes per step -->
  <section class="step" data-panel="shop" aria-label="Product">
    <div class="viewer" id="viewer" role="img" aria-label="Product. Drag to rotate."></div>
    <aside class="card" id="card">
      <h2 id="pName"></h2>
      <p class="meta" id="pMeta"></p>
      <div class="pills" id="pills" role="tablist" aria-label="Products"></div>
      <button class="btn btn-solid cta" id="mainCta">See inside</button>
    </aside>
    <p class="hint" id="hint">Drag to rotate</p>
  </section>

  <!-- 5 · BAG / CHECKOUT -->
  <section class="step" data-panel="bag" aria-label="Bag">
    <div class="cart-panel" id="cartPanel">
      <div id="cartBody"></div>
    </div>
  </section>

  <div class="mol-ui" id="molUi" aria-hidden="true">
    <div class="mol-label"><b></b><i></i></div>
    <div class="mol-label"><b></b><i></i></div>
    <div class="mol-label"><b></b><i></i></div>
    <p class="mol-foot">Illustrative structures</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
